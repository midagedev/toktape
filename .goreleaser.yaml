# GoReleaser v2 — https://goreleaser.com
#
# One static binary per platform, nothing to resolve at runtime. Linux is the
# primary target (amd64 for workstations, arm64 for Jetson/Grace boxes); macOS
# and Windows are built so a laptop can attach to a remote llama-server with
# --url. Off Linux there is no procfs, so the memory and fault rows print "?":
# the same reduced view on both, and the reason neither is the primary target.
#
# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# .github/workflows/release.yml then runs `goreleaser release --clean`.
version: 2

project_name: toktape

before:
  hooks:
    - go mod tidy

builds:
  - id: toktape
    main: ./cmd/toktape
    binary: toktape
    env:
      # No cgo anywhere in the tree; this keeps the artifacts fully static.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # cmd/toktape/main.go declares `var version = "dev"`, so the symbol that -X
    # has to reach is main.version.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: toktape
    ids:
      - toktape
    formats:
      - tar.gz
    # Windows ships a .zip, the archive a Windows release asset is expected to
    # be and the one Explorer opens with nothing installed. scripts/install.sh
    # stays tar.gz-only and POSIX-only; it names this file rather than fetching
    # it, so a Git Bash user is told where to go instead of being told the
    # binary does not exist.
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Explicit, because the default template appends a conditional arch version
    # suffix. scripts/install.sh builds this exact string from uname, so the two
    # must be read together.
    name_template: "toktape_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  # Plain checksums.txt, not the default toktape_<version>_checksums.txt:
  # scripts/install.sh fetches it by a fixed name.
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  # Commit subjects in this repo are `pkg: summary`, not Conventional Commits,
  # so the grouping is permissive on purpose: anything that happens to carry a
  # feat/fix prefix is grouped, everything else falls into Changes. A subject
  # that matches nothing must never fail the release.
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Changes
      order: 999
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: midagedev
    name: toktape
  draft: false
  prerelease: auto
  name_template: "toktape {{ .Tag }}"
  # The changelog below is every commit subject in one flat list, because this
  # repo writes `pkg: summary` rather than Conventional Commits. That is a
  # reasonable record and a poor introduction, so the header says what a reader
  # has to know before reading it. Rewrite it per release; it is not a template.
  header: |
    **Images go in.** `toktape record --image photo.png` sends a PNG,
    JPEG or WebP with the prompt as an OpenAI content part, and
    `--image builtin` sends a 640×480 test image, so a vision run needs no
    file of your own. A prompts file takes an `images` key per line. The
    card adds an Image row (`1 × 640×480 PNG (builtin) · prefill includes
    it`), and the tape stores each image as a reference (name, size,
    digest), never its bytes. A server whose `/props` says it takes no
    images is refused before the run; for llama-server, the message names
    `--mmproj`. The PNG card has no Image row yet.

    **RIG names the card the server used.** On a host with several GPUs,
    the card listed all of them even when the server ran on one. The rig
    line now lists the GPUs the server's own process held memory on, then
    how many sat idle (`RTX A6000 48G · +1 idle`), and the hub files the
    run under that card. A tape with no per-process GPU reading keeps the
    host's full list.

    **A publish from a script never hangs.** A first publish run over ssh
    with no input but a controlling terminal in the background opened
    the terminal to ask, took SIGTTIN and stopped; a stopped process does
    not hear `timeout`. toktape now asks only when it holds the terminal's
    foreground, and otherwise refuses at once with "no terminal to
    confirm on" and the `--yes` hint. The clipboard's terminal write has
    the same guard.

    **A model file named by an engine's `-m` is read.** A server that
    declares its own engine (bloomery) reported a file name or a path but
    no size or quant, so the card and the hub printed `?`. The
    recorder now reads `-m` from the server's command line, resolves it
    against the server's working directory, and reads the file's size and
    GGUF header. When the file cannot be read, the hub takes the quant
    from the file name; re-publishing an earlier tape repairs it.

    **RAM says GiB.** The card divided RAM by 2^30 and printed "GB"; it
    now prints "GiB" (`122 GiB unified`, `252 GiB`).

    **share checks a remembered link.** A run deleted or taken down on
    the hub since it was published answers 404; `toktape share` now drops
    that link and publishes the tape again. A private run's link still
    opens, so it stays. When the check itself fails, the link is kept and
    share says it was not checked.

  footer: |
    ## Install

    ```sh
    brew install midagedev/tap/toktape
    ```

    ```sh
    curl -fsSL https://raw.githubusercontent.com/midagedev/toktape/main/scripts/install.sh | sh
    ```

# A formula, not a cask: casks are macOS-only and Linux is this tool's primary
# target, so Linuxbrew users need `brew install midagedev/tap/toktape` to work.
brews:
  - name: toktape
    ids:
      - toktape
    repository:
      owner: midagedev
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/midagedev/toktape"
    description: "The black-box tape for local LLM serving"
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "toktape: {{ .Tag }}"
    test: |
      system "#{bin}/toktape", "version"
