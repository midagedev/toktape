# GoReleaser v2 — https://goreleaser.com
#
# One static binary per platform, nothing to resolve at runtime. Linux is the
# primary target (amd64 for workstations, arm64 for Jetson/Grace boxes); macOS
# and Windows are built so a laptop can attach to a remote llama-server with
# --url. Off Linux there is no procfs, so the memory and fault rows print "?":
# the same reduced view on both, and the reason neither is the primary target.
#
# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# .github/workflows/release.yml then runs `goreleaser release --clean`.
version: 2

project_name: toktape

before:
  hooks:
    - go mod tidy

builds:
  - id: toktape
    main: ./cmd/toktape
    binary: toktape
    env:
      # No cgo anywhere in the tree; this keeps the artifacts fully static.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # cmd/toktape/main.go declares `var version = "dev"`, so the symbol that -X
    # has to reach is main.version.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: toktape
    ids:
      - toktape
    formats:
      - tar.gz
    # Windows ships a .zip, the archive a Windows release asset is expected to
    # be and the one Explorer opens with nothing installed. scripts/install.sh
    # stays tar.gz-only and POSIX-only; it names this file rather than fetching
    # it, so a Git Bash user is told where to go instead of being told the
    # binary does not exist.
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Explicit, because the default template appends a conditional arch version
    # suffix. scripts/install.sh builds this exact string from uname, so the two
    # must be read together.
    name_template: "toktape_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  # Plain checksums.txt, not the default toktape_<version>_checksums.txt:
  # scripts/install.sh fetches it by a fixed name.
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  # Commit subjects in this repo are `pkg: summary`, not Conventional Commits,
  # so the grouping is permissive on purpose: anything that happens to carry a
  # feat/fix prefix is grouped, everything else falls into Changes. A subject
  # that matches nothing must never fail the release.
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Changes
      order: 999
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: midagedev
    name: toktape
  draft: false
  prerelease: auto
  name_template: "toktape {{ .Tag }}"
  # The changelog below is every commit subject in one flat list, because this
  # repo writes `pkg: summary` rather than Conventional Commits. That is a
  # reasonable record and a poor introduction, so the header says what a reader
  # has to know before reading it. Rewrite it per release; it is not a template.
  header: |
    **A server that is not llama.cpp is recorded as itself, and Windows gets
    a binary.** Two things a reader could not do with v0.2.4.

    An engine that names itself in `/props` is now stamped with the name it
    gave, whatever that name is. Before, one engine was matched by hand and
    every other one fell through to llama.cpp's rules: a mistral.rs server
    that had said its name and its version in the one field that exists for
    saying them printed `?` for ENGINE, and had its own argv run through
    llama.cpp's flag grammar, so the FLAGS row named flags the run never had.
    Attaching the next OpenAI-compatible engine costs no change here at all.

    A server that answers `/props` on another process's behalf — a shim in
    front of an engine that speaks only the OpenAI API — can now name the pid
    doing the work. toktape used to find the server by an argv holding the
    model path, or by who held the listening socket, and both answer "the
    process I am talking to", which for a shim is the shim. Memory, page
    faults and the GPU processes counted as "not ours" then described the
    proxy: eight measured takes on a machine held by a single lease all read
    `contended: yes`, which is the one thing the quiet-machine protocol
    exists to rule out.

    **Windows.** `toktape_<version>_windows_amd64.zip` and an arm64 zip are
    on this page. The view is macOS's — attach with `--url`, and the `/proc`
    rows print `?` — and WSL2 still runs the Linux binary for the full one.
    The binaries are cross-compiled and the merge gate builds them; nobody
    has run one on Windows yet, so please say if something is wrong.

    The card also says when thinking-off was asked for and the server thought
    anyway, `toktape render --help` says what canvas each output draws and
    how to cut a window out of a clip, and the README's clip is a four-stream
    Qwen run recorded with thinking genuinely off.

    New since v0.1.0 or v0.2.1? The
    [v0.2.2 notes](https://github.com/midagedev/toktape/releases/tag/v0.2.2)
    describe recording a server that is not llama.cpp, and the
    [v0.2.0 notes](https://github.com/midagedev/toktape/releases/tag/v0.2.0)
    the release where `-n` changed meaning.

  footer: |
    ## Install

    ```sh
    brew install midagedev/tap/toktape
    ```

    ```sh
    curl -fsSL https://raw.githubusercontent.com/midagedev/toktape/main/scripts/install.sh | sh
    ```

# A formula, not a cask: casks are macOS-only and Linux is this tool's primary
# target, so Linuxbrew users need `brew install midagedev/tap/toktape` to work.
brews:
  - name: toktape
    ids:
      - toktape
    repository:
      owner: midagedev
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/midagedev/toktape"
    description: "The black-box tape for local LLM serving"
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "toktape: {{ .Tag }}"
    test: |
      system "#{bin}/toktape", "version"
