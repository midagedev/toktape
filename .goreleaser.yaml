# GoReleaser v2 — https://goreleaser.com
#
# One static binary per platform, nothing to resolve at runtime. Linux is the
# primary target (amd64 for workstations, arm64 for Jetson/Grace boxes); macOS
# and Windows are built so a laptop can attach to a remote llama-server with
# --url. Off Linux there is no procfs, so the memory and fault rows print "?":
# the same reduced view on both, and the reason neither is the primary target.
#
# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# .github/workflows/release.yml then runs `goreleaser release --clean`.
version: 2

project_name: toktape

before:
  hooks:
    - go mod tidy

builds:
  - id: toktape
    main: ./cmd/toktape
    binary: toktape
    env:
      # No cgo anywhere in the tree; this keeps the artifacts fully static.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # cmd/toktape/main.go declares `var version = "dev"`, so the symbol that -X
    # has to reach is main.version.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: toktape
    ids:
      - toktape
    formats:
      - tar.gz
    # Windows ships a .zip, the archive a Windows release asset is expected to
    # be and the one Explorer opens with nothing installed. scripts/install.sh
    # stays tar.gz-only and POSIX-only; it names this file rather than fetching
    # it, so a Git Bash user is told where to go instead of being told the
    # binary does not exist.
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Explicit, because the default template appends a conditional arch version
    # suffix. scripts/install.sh builds this exact string from uname, so the two
    # must be read together.
    name_template: "toktape_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  # Plain checksums.txt, not the default toktape_<version>_checksums.txt:
  # scripts/install.sh fetches it by a fixed name.
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  # Commit subjects in this repo are `pkg: summary`, not Conventional Commits,
  # so the grouping is permissive on purpose: anything that happens to carry a
  # feat/fix prefix is grouped, everything else falls into Changes. A subject
  # that matches nothing must never fail the release.
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Changes
      order: 999
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: midagedev
    name: toktape
  draft: false
  prerelease: auto
  name_template: "toktape {{ .Tag }}"
  # The changelog below is every commit subject in one flat list, because this
  # repo writes `pkg: summary` rather than Conventional Commits. That is a
  # reasonable record and a poor introduction, so the header says what a reader
  # has to know before reading it. Rewrite it per release; it is not a template.
  header: |
    **The card stops saying things it did not see.** The thread through this
    release is one defect wearing different clothes: something toktape never
    observed was printed as if it had been observed and found empty.

    **Thinking models get a rate.** Measured on Ollama 0.34.2 with qwen3:1.7b:
    the server counted 48 tokens and the client parsed none, because the
    thinking text arrives under `reasoning` where vLLM and exl3-serve send
    `reasoning_content`. No calibration, no cap, `Sample ?`. Both spellings are
    read now, and the same run prints `Decode 60.5 tok/s`. The tape also
    records how many tokens the client actually saw, so the next unknown
    dialect raises a caveat (`tokens_unseen`) instead of a blank card.

    **The clock waits when cutting would destroy the run.** On a server that
    counts tokens only in a closing `usage` message, a stream the clock cancels
    sends no count at all. Six runs on one Mac against Ollama: every answer cap
    was over budget, and the three that produced a card were the three where
    the model happened to stop early. The cap is now priced below the slowest
    run measured, prefill is reserved even when it could not be calibrated, and
    on these servers the cut is held back — bounded at half the budget again —
    for live streams to end on their own. llama.cpp runs take the identical
    path as before. The tape says the allowance was there.

    **A Mac states its own hardware.** `RIG ? · ? · ?` is now
    `RIG ? · Apple M1 Pro · 32 GB`, with the macOS version beside the engine.
    And a machine whose GPU inventory was never read (no `nvidia-smi`) is no
    longer described as a machine without GPUs: the placement line says where
    the layers went is unknown, rather than claiming they all ran on the CPU
    while Metal was holding them. Unified memory still has no word of its own
    on the card; that is the next piece of work.

    **Two caveats stopped crying wolf.** `conditions changed` fired on both
    recorded runs that did real work, because a machine warms up when it
    decodes for a minute. A temperature rise is now printed only beside a clock cap that
    moved — it is the cap's explanation, not a finding. A fall is printed on its
    own: a machine cooler at the end than at the start was already warm when
    the run began. And `contended` no longer counts a process on a GPU holding
    none of the server's weights.

    **An empty server is told what to type.** Ollama with nothing pulled —
    every reader's first five minutes — answered `model is required` and was
    told to check its slot count. It is now told `ollama pull`. That row, and
    a fake Ollama that can actually lose the race the real one loses, are in
    the first-run matrix (21 rows).

    `toktape render` and `toktape play` no longer print `tape saved: <path>`
    for a path they never wrote. `--explain` is gated to have a reading for
    every caveat the card can raise. README: what Windows actually does,
    measured on one, and simplified and traditional Chinese, each written on
    its own.
  footer: |
    ## Install

    ```sh
    brew install midagedev/tap/toktape
    ```

    ```sh
    curl -fsSL https://raw.githubusercontent.com/midagedev/toktape/main/scripts/install.sh | sh
    ```

# A formula, not a cask: casks are macOS-only and Linux is this tool's primary
# target, so Linuxbrew users need `brew install midagedev/tap/toktape` to work.
brews:
  - name: toktape
    ids:
      - toktape
    repository:
      owner: midagedev
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/midagedev/toktape"
    description: "The black-box tape for local LLM serving"
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "toktape: {{ .Tag }}"
    test: |
      system "#{bin}/toktape", "version"
