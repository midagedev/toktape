# GoReleaser v2 — https://goreleaser.com
#
# One static binary per platform, nothing to resolve at runtime. Linux is the
# primary target (amd64 for workstations, arm64 for Jetson/Grace boxes) and
# macOS is built so a laptop can attach to a remote llama-server with --url.
#
# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# .github/workflows/release.yml then runs `goreleaser release --clean`.
version: 2

project_name: toktape

before:
  hooks:
    - go mod tidy

builds:
  - id: toktape
    main: ./cmd/toktape
    binary: toktape
    env:
      # No cgo anywhere in the tree; this keeps the artifacts fully static.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # cmd/toktape/main.go declares `var version = "dev"`, so the symbol that -X
    # has to reach is main.version.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: toktape
    ids:
      - toktape
    formats:
      - tar.gz
    # Explicit, because the default template appends a conditional arch version
    # suffix. scripts/install.sh builds this exact string from uname, so the two
    # must be read together.
    name_template: "toktape_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  # Plain checksums.txt, not the default toktape_<version>_checksums.txt:
  # scripts/install.sh fetches it by a fixed name.
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  # Commit subjects in this repo are `pkg: summary`, not Conventional Commits,
  # so the grouping is permissive on purpose: anything that happens to carry a
  # feat/fix prefix is grouped, everything else falls into Changes. A subject
  # that matches nothing must never fail the release.
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Changes
      order: 999
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: midagedev
    name: toktape
  draft: false
  prerelease: auto
  name_template: "toktape {{ .Tag }}"
  # The changelog below is every commit subject in one flat list, because this
  # repo writes `pkg: summary` rather than Conventional Commits. That is a
  # reasonable record and a poor introduction, so the header says what a reader
  # has to know before reading it. Rewrite it per release; it is not a template.
  header: |
    **The card's caveats now say what its figures say.** Three sentences a
    concurrent run could print were wrong about the run they described.

    The client-versus-server warning judged the streams' own verdicts while
    printing their mean, so a card could say "over the 2% tolerance" about two
    figures 1.3% apart. It now judges the figures it prints, and says
    separately how many streams the server's own number did not confirm.

    The Streams row stops writing `2 × 11.6 tok/s = 19.4 tok/s aggregate`.
    Both figures are the run's — the streams finished ten seconds apart, so
    the aggregate divides by a window whose tail holds one stream — and the
    equation between them was the false part. The three figures are listed
    instead whenever the product misses the aggregate by more than 2%.

    A warning that fires twice is listed once with a count, and the caveat
    about a server whose memory is summed over a process tree no longer
    prints a process id onto a card people publish.

    New since v0.1.0 or v0.2.1? The
    [v0.2.2 notes](https://github.com/midagedev/toktape/releases/tag/v0.2.2)
    describe recording a server that is not llama.cpp, and the
    [v0.2.0 notes](https://github.com/midagedev/toktape/releases/tag/v0.2.0)
    the release where `-n` changed meaning.

  footer: |
    ## Install

    ```sh
    brew install midagedev/tap/toktape
    ```

    ```sh
    curl -fsSL https://raw.githubusercontent.com/midagedev/toktape/main/scripts/install.sh | sh
    ```

# A formula, not a cask: casks are macOS-only and Linux is this tool's primary
# target, so Linuxbrew users need `brew install midagedev/tap/toktape` to work.
brews:
  - name: toktape
    ids:
      - toktape
    repository:
      owner: midagedev
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/midagedev/toktape"
    description: "The black-box tape for local LLM serving"
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "toktape: {{ .Tag }}"
    test: |
      system "#{bin}/toktape", "version"
