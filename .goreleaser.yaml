# GoReleaser v2 — https://goreleaser.com
#
# One static binary per platform, nothing to resolve at runtime. Linux is the
# primary target (amd64 for workstations, arm64 for Jetson/Grace boxes); macOS
# and Windows are built so a laptop can attach to a remote llama-server with
# --url. Off Linux there is no procfs, so the memory and fault rows print "?":
# the same reduced view on both, and the reason neither is the primary target.
#
# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# .github/workflows/release.yml then runs `goreleaser release --clean`.
version: 2

project_name: toktape

before:
  hooks:
    - go mod tidy

builds:
  - id: toktape
    main: ./cmd/toktape
    binary: toktape
    env:
      # No cgo anywhere in the tree; this keeps the artifacts fully static.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # cmd/toktape/main.go declares `var version = "dev"`, so the symbol that -X
    # has to reach is main.version.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: toktape
    ids:
      - toktape
    formats:
      - tar.gz
    # Windows ships a .zip, the archive a Windows release asset is expected to
    # be and the one Explorer opens with nothing installed. scripts/install.sh
    # stays tar.gz-only and POSIX-only; it names this file rather than fetching
    # it, so a Git Bash user is told where to go instead of being told the
    # binary does not exist.
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Explicit, because the default template appends a conditional arch version
    # suffix. scripts/install.sh builds this exact string from uname, so the two
    # must be read together.
    name_template: "toktape_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  # Plain checksums.txt, not the default toktape_<version>_checksums.txt:
  # scripts/install.sh fetches it by a fixed name.
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  # Commit subjects in this repo are `pkg: summary`, not Conventional Commits,
  # so the grouping is permissive on purpose: anything that happens to carry a
  # feat/fix prefix is grouped, everything else falls into Changes. A subject
  # that matches nothing must never fail the release.
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Changes
      order: 999
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: midagedev
    name: toktape
  draft: false
  prerelease: auto
  name_template: "toktape {{ .Tag }}"
  # The changelog below is every commit subject in one flat list, because this
  # repo writes `pkg: summary` rather than Conventional Commits. That is a
  # reasonable record and a poor introduction, so the header says what a reader
  # has to know before reading it. Rewrite it per release; it is not a template.
  header: |
    **A rig with four GPUs fits on the screen, and every figure is printed
    once.** On a four-card machine the headline rate — the reason the big
    scoreboard exists — did not render at all.

    The right column's height was a function of the card count. PLACEMENT
    grew a VRAM bar per device and RESOURCES a header and a graph per device,
    so each card cost two rows and the layout paid for them out of whatever
    was left. Measured on the README's recording at the 120x36 the clip is
    drawn in: two cards kept the scoreboard by taking every resource graph
    down to nothing, and three gave up the scoreboard instead.

    The devices are one table now. A row per card carries that card's VRAM
    bar, its bytes, its utilisation and its temperature, over a single graph
    they share — the mean across the cards that reported a utilisation, so a
    card nobody could read is left out of the mean rather than counted as
    idle, and still prints `?` for what was not measured. The column grows one
    row per card instead of two, and a four-card rig keeps the headline and
    the graphs together.

    PLACEMENT is left with what the word means, where the model itself sits: a
    card's used VRAM is a live nvidia-smi reading and was never a placement.
    An offloaded run reads better for it — the host row and the VRAM row are
    adjacent now, with nothing between them, so the balance is one glance.

    **The headline was on screen twice**, five rows apart and in two sizes:
    the scoreboard and SPEED's first row drew the same number. The word that
    row had and the board did not — decode against sample — moves onto the
    board's unit line, and the row returns only on a screen too short for the
    board, where it is the one place the figure appears. The per-stream mean
    left the column too, since every stream's own tile already leads with it.

    **The card, the same rule.** Three figures were printed twice on it, and
    the Streams row's whole first line was one of them. Each figure now
    appears in the row whose label names what it is about: the decode rates
    are Decode's, the prefill rates and where the wait went are Prefill's,
    and on a concurrent run TTFT sits beside its own p95 in Streams. That took
    `N × per-stream = aggregate` with it — and what the equation was standing
    in for survives as words, because when the streams did not share a decode
    window the row now says so: `4 streams · not all decoding at once`. It is
    the card's first account of why four streams at 42.1 tok/s are not 144.

    Nothing was re-recorded: the README's clip is the same run drawn through
    the new column.

    New since v0.2.4 or earlier? The
    [v0.2.5 notes](https://github.com/midagedev/toktape/releases/tag/v0.2.5)
    cover engines that name themselves, a server that can name the process
    doing the work, and the Windows zips; the
    [v0.2.2 notes](https://github.com/midagedev/toktape/releases/tag/v0.2.2)
    describe recording a server that is not llama.cpp, and the
    [v0.2.0 notes](https://github.com/midagedev/toktape/releases/tag/v0.2.0)
    the release where `-n` changed meaning.

  footer: |
    ## Install

    ```sh
    brew install midagedev/tap/toktape
    ```

    ```sh
    curl -fsSL https://raw.githubusercontent.com/midagedev/toktape/main/scripts/install.sh | sh
    ```

# A formula, not a cask: casks are macOS-only and Linux is this tool's primary
# target, so Linuxbrew users need `brew install midagedev/tap/toktape` to work.
brews:
  - name: toktape
    ids:
      - toktape
    repository:
      owner: midagedev
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/midagedev/toktape"
    description: "The black-box tape for local LLM serving"
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "toktape: {{ .Tag }}"
    test: |
      system "#{bin}/toktape", "version"
