# GoReleaser v2 — https://goreleaser.com
#
# One static binary per platform, nothing to resolve at runtime. Linux is the
# primary target (amd64 for workstations, arm64 for Jetson/Grace boxes) and
# macOS is built so a laptop can attach to a remote llama-server with --url.
#
# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# .github/workflows/release.yml then runs `goreleaser release --clean`.
version: 2

project_name: toktape

before:
  hooks:
    - go mod tidy

builds:
  - id: toktape
    main: ./cmd/toktape
    binary: toktape
    env:
      # No cgo anywhere in the tree; this keeps the artifacts fully static.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # cmd/toktape/main.go declares `var version = "dev"`, so the symbol that -X
    # has to reach is main.version.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: toktape
    ids:
      - toktape
    formats:
      - tar.gz
    # Explicit, because the default template appends a conditional arch version
    # suffix. scripts/install.sh builds this exact string from uname, so the two
    # must be read together.
    name_template: "toktape_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  # Plain checksums.txt, not the default toktape_<version>_checksums.txt:
  # scripts/install.sh fetches it by a fixed name.
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  # Commit subjects in this repo are `pkg: summary`, not Conventional Commits,
  # so the grouping is permissive on purpose: anything that happens to carry a
  # feat/fix prefix is grouped, everything else falls into Changes. A subject
  # that matches nothing must never fail the release.
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Changes
      order: 999
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: midagedev
    name: toktape
  draft: false
  prerelease: auto
  name_template: "toktape {{ .Tag }}"
  # The changelog below is every commit subject in one flat list, because this
  # repo writes `pkg: summary` rather than Conventional Commits. That is a
  # reasonable record and a poor introduction, so the header says what a reader
  # has to know before reading it. Rewrite it per release; it is not a template.
  header: |
    **A run is aimed in seconds now.** `toktape` with no flags gives a 20 s
    run, and `--for 45s` gives a 45 s one, whatever the tokens per second. No
    stream is cut under 64 tokens, so a slow box runs longer rather than
    reporting a rate from four tokens.

    **`-n` means tokens per stream, as in llama-bench.** Concurrent streams are
    `--sessions N`, capped at 8 unless `--max-sessions` raises it. This is a
    breaking rename: `-n 4` used to mean four streams and now means four
    tokens. Nothing is aliased — the old spelling is gone, on purpose, while
    the tool is young enough to change it cleanly.

    **One output flag.** `-o csv|json|jsonl|md|sql|tsv`, on every verb that has
    something to print, in llama-bench's vocabulary. `toktape log -o sql |
    sqlite3 runs.db` gives you every run you have recorded as a table, numbers
    stored as numbers and unknowns as NULL.

    **The card says when not to quote it.** Every card ends with its caveats —
    a cold cache, a prompt too short to be a prefill measurement, a stream too
    short to be a rate, a machine that changed under the run — and `-o json`
    carries the same list as `caveats`, each with a severity. It is the field
    to read before putting a number in a post.

    **For agents.** Documented exit codes (0 ok, 1 usage, 2 unreachable,
    3 streams, 4 unavailable), one JSON object on stdout whether the run
    succeeds or fails, `toktape help agents`, and `docs/agents.md`.

    New measurements: bytes per verify step for a speculative run, the engine's
    own prefill split from the wait for a free slot, and per-round prefill and
    prefix-cache figures.

    The clip and the card below were recorded with this build on a 444 GiB
    model served from a 251 GB box — [42 s](https://drive.google.com/file/d/1DcyQCgp0_Uo9B8lRyMvI3ZjpPOg-Xug4/view?usp=drivesdk).

  footer: |
    ## Install

    ```sh
    brew install midagedev/tap/toktape
    ```

    ```sh
    curl -fsSL https://raw.githubusercontent.com/midagedev/toktape/main/scripts/install.sh | sh
    ```

# A formula, not a cask: casks are macOS-only and Linux is this tool's primary
# target, so Linuxbrew users need `brew install midagedev/tap/toktape` to work.
brews:
  - name: toktape
    ids:
      - toktape
    repository:
      owner: midagedev
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/midagedev/toktape"
    description: "The black-box tape for local LLM serving"
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "toktape: {{ .Tag }}"
    test: |
      system "#{bin}/toktape", "version"
