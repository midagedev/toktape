# GoReleaser v2 — https://goreleaser.com
#
# One static binary per platform, nothing to resolve at runtime. Linux is the
# primary target (amd64 for workstations, arm64 for Jetson/Grace boxes); macOS
# and Windows are built so a laptop can attach to a remote llama-server with
# --url. Off Linux there is no procfs, so the memory and fault rows print "?":
# the same reduced view on both, and the reason neither is the primary target.
#
# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# .github/workflows/release.yml then runs `goreleaser release --clean`.
version: 2

project_name: toktape

before:
  hooks:
    - go mod tidy

builds:
  - id: toktape
    main: ./cmd/toktape
    binary: toktape
    env:
      # No cgo anywhere in the tree; this keeps the artifacts fully static.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # cmd/toktape/main.go declares `var version = "dev"`, so the symbol that -X
    # has to reach is main.version.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: toktape
    ids:
      - toktape
    formats:
      - tar.gz
    # Windows ships a .zip, the archive a Windows release asset is expected to
    # be and the one Explorer opens with nothing installed. scripts/install.sh
    # stays tar.gz-only and POSIX-only; it names this file rather than fetching
    # it, so a Git Bash user is told where to go instead of being told the
    # binary does not exist.
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Explicit, because the default template appends a conditional arch version
    # suffix. scripts/install.sh builds this exact string from uname, so the two
    # must be read together.
    name_template: "toktape_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  # Plain checksums.txt, not the default toktape_<version>_checksums.txt:
  # scripts/install.sh fetches it by a fixed name.
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  # Commit subjects in this repo are `pkg: summary`, not Conventional Commits,
  # so the grouping is permissive on purpose: anything that happens to carry a
  # feat/fix prefix is grouped, everything else falls into Changes. A subject
  # that matches nothing must never fail the release.
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Changes
      order: 999
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: midagedev
    name: toktape
  draft: false
  prerelease: auto
  name_template: "toktape {{ .Tag }}"
  # The changelog below is every commit subject in one flat list, because this
  # repo writes `pkg: summary` rather than Conventional Commits. That is a
  # reasonable record and a poor introduction, so the header says what a reader
  # has to know before reading it. Rewrite it per release; it is not a template.
  header: |
    **The record has a home on the web.** `toktape publish` puts a run at
    tape.midagedev.com, where it replays in the browser from the record itself
    — not a video of it — and the card that qualifies the figure rides along.

    The run file's extension changed with it. A recording is now `run.toktape`,
    because Charm's VHS uses `.tape` for the opposite kind of file, a script of
    what to type, and a record that says "this really happened" cannot wear the
    extension that means staging. Both are read everywhere, so a `~/.toktape/runs`
    full of the old name keeps working and nothing has to be renamed.

    **What the site is.** The listing is a feed at every width: each run leads its
    row and replays in place as it scrolls past, one across on a phone and two or
    three on a desktop. Newest first, with no rank column and no score — a
    run's caveats travel with it, and a search result that drops them is a
    leaderboard with the sorting removed. An order is there when you ask for it
    (`?sort=decode`), and the total line says in words that it is putting
    different models, streams and quantisations side by side.

    **The figures behind a rate.** A row used to carry the rate and the hardware,
    which is not enough to say why two runs of one model on one GPU differ. It now
    carries the workload (`P238 · G214 · cache 0%`), the configuration (`fa on ·
    kv q8_0`, `offload partial`), the size (`35B · 3.5B active`) and, beside the
    measured prompt and deliberately quieter than it, the context window the
    server reserved. That order is the point: a research pass found the
    reservation is near the bottom of what moves a decode rate on a short prompt,
    and the things above it are stream count, generated length, spill, weight
    bits, speculative acceptance, throttling and a cold mmap.

    Size bands stand on active parameters, so a 35B mixture that touches 3.5B per
    token is searched as the 3.5B model a decode experiences, not grouped with
    dense 35B weights it has nothing in common with.

    **Read it from the terminal.** `toktape runs` prints the site's listing as a
    table and takes the same filters, `toktape show <id> --save run.toktape`
    fetches one record so `toktape card` can draw it again locally, and
    `toktape reindex <id>` recomputes a published run's search row from the record
    the service already holds — which is how a run published last week gains the
    fields a newer toktape knows how to derive. Reading is free and needs no
    token; recording is not.

    **Any OpenAI-compatible server.** A server that does not answer `/props` is
    attached through `/v1/models` (`--engine-kind auto|llama|openai`), and when it
    reports no timings of its own the recorder's clock becomes the record and says
    so — `client-timed` on the card and a caveat on the run. Chunks are not tokens,
    so the count comes from the final chunk's `usage`; without one the rate prints
    `?` rather than a number derived from chunk arrivals.

    **What does not go up.** The published view was already dropping the machine's
    name, the listening host and every absolute path — including the parsed copy of
    argv that the card actually prints, which is where a model path escaped once.
    It now also drops the UTC offset: the instant is published, the time zone is
    not. `+09:00` beside a GPU model and a quantisation narrows a person further
    than any of them alone, and nobody typed it — `time.Time` carried it. A
    publisher who wants "benchmarked at 2am local" in the record writes it in the
    title, which is the same test the host label passes. `toktape publish
    --dry-run` prints the whole record that would go up, field by field.

    **The card qualifies three figures it used to leave quotable.** A prefill
    rate is a measurement of a prefill, and a prompt the server had already
    cached is not one — a run whose prompt came back mostly out of the prefix
    cache now says which part of it did, beside the rate rather than in another
    row. A concurrent run whose streams did not share a decode window says so at
    the Decode row itself, where the arithmetic is: four streams at 42.1 tok/s
    are not the 144 aggregate, and the sentence that explains it is now next to
    both numbers instead of five rows away. And a p50 beside a p95 computed from
    two samples prints as one figure, because two percentiles of two samples are
    a pair only in the typography.

    New since v0.2.4 or earlier? The
    [v0.2.6 notes](https://github.com/midagedev/toktape/releases/tag/v0.2.6)
    cover the four-card layout and the de-duplicated figures, the
    [v0.2.5 notes](https://github.com/midagedev/toktape/releases/tag/v0.2.5)
    engines that name themselves and the Windows zips, and the
    [v0.2.0 notes](https://github.com/midagedev/toktape/releases/tag/v0.2.0)
    the release where `-n` changed meaning.
  footer: |
    ## Install

    ```sh
    brew install midagedev/tap/toktape
    ```

    ```sh
    curl -fsSL https://raw.githubusercontent.com/midagedev/toktape/main/scripts/install.sh | sh
    ```

# A formula, not a cask: casks are macOS-only and Linux is this tool's primary
# target, so Linuxbrew users need `brew install midagedev/tap/toktape` to work.
brews:
  - name: toktape
    ids:
      - toktape
    repository:
      owner: midagedev
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/midagedev/toktape"
    description: "The black-box tape for local LLM serving"
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "toktape: {{ .Tag }}"
    test: |
      system "#{bin}/toktape", "version"
