# GoReleaser v2 — https://goreleaser.com
#
# One static binary per platform, nothing to resolve at runtime. Linux is the
# primary target (amd64 for workstations, arm64 for Jetson/Grace boxes); macOS
# and Windows are built so a laptop can attach to a remote llama-server with
# --url. Off Linux there is no procfs, so the memory and fault rows print "?":
# the same reduced view on both, and the reason neither is the primary target.
#
# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# .github/workflows/release.yml then runs `goreleaser release --clean`.
version: 2

project_name: toktape

before:
  hooks:
    - go mod tidy

builds:
  - id: toktape
    main: ./cmd/toktape
    binary: toktape
    env:
      # No cgo anywhere in the tree; this keeps the artifacts fully static.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # cmd/toktape/main.go declares `var version = "dev"`, so the symbol that -X
    # has to reach is main.version.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: toktape
    ids:
      - toktape
    formats:
      - tar.gz
    # Windows ships a .zip, the archive a Windows release asset is expected to
    # be and the one Explorer opens with nothing installed. scripts/install.sh
    # stays tar.gz-only and POSIX-only; it names this file rather than fetching
    # it, so a Git Bash user is told where to go instead of being told the
    # binary does not exist.
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Explicit, because the default template appends a conditional arch version
    # suffix. scripts/install.sh builds this exact string from uname, so the two
    # must be read together.
    name_template: "toktape_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  # Plain checksums.txt, not the default toktape_<version>_checksums.txt:
  # scripts/install.sh fetches it by a fixed name.
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  # Commit subjects in this repo are `pkg: summary`, not Conventional Commits,
  # so the grouping is permissive on purpose: anything that happens to carry a
  # feat/fix prefix is grouped, everything else falls into Changes. A subject
  # that matches nothing must never fail the release.
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Changes
      order: 999
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: midagedev
    name: toktape
  draft: false
  prerelease: auto
  name_template: "toktape {{ .Tag }}"
  # The changelog below is every commit subject in one flat list, because this
  # repo writes `pkg: summary` rather than Conventional Commits. That is a
  # reasonable record and a poor introduction, so the header says what a reader
  # has to know before reading it. Rewrite it per release; it is not a template.
  header: |
    **The first try is the release.** The default command used to need luck:
    on a real 4-slot server it lost streams to the context, measured a cached
    prompt on the second run, and spent the whole clock in prefill. One planner
    now decides prompt length, answer cap and clock together, before the first
    request, from what it measured on your server — and prints that decision as
    one `plan:` line.

    **What the plan does.** Every run salts its prompts, so a prefix cache never
    answers for the machine. Prompts are counted by the server's own tokenizer
    and trimmed to the tightest of two ceilings: a quarter of the clock, using
    the prefill rate measured with as many prompts at once as the run will send
    (several prefills at once ran at a fifth of the one-stream rate on the box
    this was built on — it is measured, not assumed), and the slot's context
    less the answer. The trim converges to within 3% in tokens, because equal
    characters were 4901 to 7458 tokens on one tokenizer.

    **Ollama, LM Studio and vLLM work on the first try too.** Bare `toktape`
    finds ports 11434 and 1234, and `--model <id>` picks a model when the server
    lists several (the card names the one that was sent). These servers count
    tokens only in a closing `usage` message, which a stream cut by the clock
    never sends, so the card printed `?`. toktape now sends two short requests
    to measure decode and prefill, then sizes prompts and the cap so streams end
    on their own inside the clock. vLLM's `max_model_len` is read as the
    context and its count is requested on every chunk; the server's prompt
    count is recorded; `system_fingerprint` names the engine. Measured on
    Ollama 0.34 and vLLM 0.29: about twenty seconds, a rate on the card.

    **A run that went wrong says why, and what to type.** Failed streams open
    the closing lines with the server's own words and one lever that follows
    the engine — `--max-model-len` on vLLM, `OLLAMA_CONTEXT_LENGTH` on Ollama,
    `-c` on llama-server. A run that finished but is no measurement says so
    before the file list. An unknown flag prints its error, the nearest flag and
    one pointer instead of 123 lines of help. A 401 is answered as a 401, and a
    connection closed mid-answer no longer reads `unexpected EOF`. Nineteen
    first-run scenarios are a gate (`TestFirstRunMatrix`).

    **Take a run down, or host the hub yourself.** `toktape publish --delete <id>`
    removes a published run; an anonymous upload's delete key is kept in
    `~/.toktape/published.json` so it is not lost with the scrollback.
    `service = "https://…"` in `config.toml` (or `TOKTAPE_SERVICE`, or `--url`)
    points every verb at your own deployment — `web/README.md` has the steps —
    and the journal token is sent only to the service it belongs to.

    The closing lines stopped advertising: they name the commands
    (`→ Markdown:`, `→ Replay:`) and nothing else. CONTRIBUTING says forks and
    AI-written pull requests are welcome.
  footer: |
    ## Install

    ```sh
    brew install midagedev/tap/toktape
    ```

    ```sh
    curl -fsSL https://raw.githubusercontent.com/midagedev/toktape/main/scripts/install.sh | sh
    ```

# A formula, not a cask: casks are macOS-only and Linux is this tool's primary
# target, so Linuxbrew users need `brew install midagedev/tap/toktape` to work.
brews:
  - name: toktape
    ids:
      - toktape
    repository:
      owner: midagedev
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/midagedev/toktape"
    description: "The black-box tape for local LLM serving"
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "toktape: {{ .Tag }}"
    test: |
      system "#{bin}/toktape", "version"
